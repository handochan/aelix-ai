name: Release

# Tag-triggered publish for the Aelix v1 distribution set.
#
# Trigger: pushing a version tag of the form `vX.Y.Z` (e.g. `v0.1.0`).
#
# Pipeline (ADR-0269, #382) - nothing is published before the candidate ran:
#   build           — `uv build --all-packages`, then DROP the aelix-server
#                     artifacts (Web-UI daemon is deferred to v1.1 and is NOT
#                     part of the v1 PyPI publish set). Uploads sdists + wheels
#                     + SHA256SUMS as a build artifact.
#   candidate-smoke — on ubuntu, macos and windows: installs THAT artifact the
#                     way install.sh / install.ps1 Step 5 install a Release
#                     (their interpreter request for the version, on the
#                     CPython uv downloads for a user with no Python in it),
#                     then runs it (`aelix --version`, a turn against a local
#                     stub). The candidate never comes from PyPI or a Release.
#   github-release  — needs build + candidate-smoke. Creates the Release that
#                     install.sh / install.ps1 resolve by default (newest tag,
#                     betas included), so it must not exist before the smoke.
#   publish         — needs build + candidate-smoke + github-release, then the
#                     `pypi` environment approval. Uploads to PyPI via
#                     **Trusted Publishing** (OIDC). No API token is stored in
#                     the repository or in any secret. The approval is the
#                     window RELEASING.md uses to run the installers against
#                     the new Release before anything reaches the index.
#
# ──────────────────────────────────────────────────────────────────────
# ONE-TIME MAINTAINER SETUP (required before the FIRST release):
#
#   PyPI Trusted Publishing must be configured on PyPI for EACH project
#   in the publish set BEFORE the tag is pushed. For each of:
#       aelix-ai, aelix-agent-core, aelix-coding-agent, aelix
#   create a "pending publisher" at https://pypi.org/manage/account/publishing/
#   (or, once the project exists, under the project's
#   "Publishing" settings) pointing at:
#       Owner:            handochan
#       Repository:       aelix-ai
#       Workflow name:    release.yml
#       Environment name: pypi
#
#   No password, no API token, no secret is added to this repository —
#   OIDC mints a short-lived token at publish time. See RELEASING.md.
# ──────────────────────────────────────────────────────────────────────
#
# Third-party actions are PINNED to a commit SHA (supply-chain hardening);
# the trailing comment records the human-readable release tag.

on:
  push:
    tags:
      # Strict-ish glob (GitHub filter syntax supports `+`); a hard regex
      # gate in the build job (below) is the real enforcement.
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Default to read-only at the workflow level; the publish job opts into
# the `id-token: write` permission it needs for OIDC.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    # Fail closed on a ref DELETION. GitHub models deleting a tag as a `push`
    # whose payload carries `deleted: true`, and the tag filter above still
    # matches the deleted ref — while `GITHUB_SHA` reverts to the default
    # branch. That combination is dangerous here rather than merely noisy:
    # `main` carries the version that was just tagged, so the pin assert below
    # would PASS on the reverted SHA and a deletion could walk the whole way to
    # an irreversible PyPI upload that nobody asked for. `github.event.deleted`
    # is negated rather than compared to `false` so a payload without the field
    # (any non-push path) still runs. `candidate-smoke`, `github-release` and
    # `publish` inherit the skip through `needs: build`.
    #
    # RELEASING.md's recovery procedure therefore force-UPDATES a tag in a
    # single ref push instead of deleting and recreating it; this guard is the
    # backstop for when someone does it the other way.
    if: ${{ !github.event.deleted }}
    permissions:
      contents: read
    outputs:
      # The tag's PEP 440 version (`v0.1.0-beta.3` -> `0.1.0b3`), written by the
      # assert step below only after every published version and pin matched it.
      # candidate-smoke installs `aelix[tui]==` exactly this.
      version: ${{ steps.pin.outputs.version }}
      # The interpreter request the installers make for that version (the
      # `request` step below); candidate-smoke installs under exactly this.
      python_request: ${{ steps.request.outputs.python_request }}
    steps:
      - name: Validate release tag is strict semver
        run: |
          tag="${{ github.ref_name }}"
          # A pre-release MUST be spelled with a HYPHEN. The github-release job
          # decides "is this a pre-release?" by testing for one — its
          # `--prerelease` case is the last reader of that signal. (The publish
          # job used to be the other: `if: !contains(ref_name, '-')` kept
          # hyphenated tags off PyPI entirely. ADR-0240 removed it — a
          # pre-release tag publishes its PEP 440 pre-version now, and what
          # protects `0.1.0` is the version itself.) The previous
          # `([.-][0-9A-Za-z.]+)?` also admitted the DOT form, so a tag like
          # `v0.1.0.rc1` passed this gate, contained no hyphen, and was
          # therefore marked a full release on GitHub while carrying an
          # IRREVERSIBLE PyPI upload (skip-existing: false) of a version PEP 440
          # reads as GA. Accepting only `vX.Y.Z` and `vX.Y.Z-<suffix>` makes
          # "no hyphen" and "is GA" the same fact.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid vX.Y.Z[-prerelease] release tag; refusing to publish. A pre-release must use a hyphen (v0.1.0-beta.1), never a dot (v0.1.0.rc1)."
            exit 1
          fi
          echo "Release tag: $tag"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Same uv as ci.yml, and the same reason for the checksum (#393):
          # this action verifies nothing past 0.11.18 by itself. ubuntu-latest
          # only - the linux x86_64 archive's sha256; a runner change fails
          # this step loudly instead of installing an unchecked uv.
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          # 3.12 and NOT the 3.11-3.14 matrix ci.yml tests on (#192, #278), on
          # purpose: this job builds, it runs no tests. Every wheel is pure
          # `py3-none-any`, and the interpreter that runs hatchling does not
          # reach the bytes - measured at 8f7d98aa with SOURCE_DATE_EPOCH fixed,
          # `uv build --all-packages --wheel` under 3.12 and under 3.13 gave
          # five byte-identical wheels. What a user's interpreter executes is
          # tested where tests run: ci.yml's legs on the branch push of the
          # commit being tagged (this job does not re-check that they passed; a
          # tag push does not trigger ci.yml), and since #382 candidate-smoke
          # below, which runs these wheels on the CPython the installers' request
          # gives a user with no Python in range.
          python-version: "3.12"
          enable-cache: true

      # The tag says one version; the workspace says another. Nothing before
      # this step made them agree, so a tag pushed without the version bump
      # (or bumped to the wrong PEP 440 spelling) would build and publish
      # artifacts whose version does not match the tag that triggered them —
      # and the PyPI upload is irreversible.
      #
      # Checking the root pyproject alone is NOT enough. Four packages publish
      # with INDEPENDENT literal versions, and they pin each other with literal
      # `==` requirements — ten places in total today (4 versions + 6 pins:
      # the meta pins all three, aelix-coding-agent pins two, aelix-agent-core
      # pins one). A bump that updates the root and misses any one of the others
      # would sail past a root-only check and publish a set whose members demand
      # a version that does not exist on the index — irreversibly, and broken on
      # install rather than merely mislabelled.
      #
      # So: assert EVERY published version and EVERY inter-package pin
      # normalizes equal to the tag, discovering both from the workspace rather
      # than hard-coding paths, so a new package or a new pin is covered the day
      # it lands. packaging's PEP 440 normalizer does the comparing, not a
      # hand-rolled one: `v0.1.0-beta.1` normalizes to `0.1.0b1`. All problems
      # are collected and printed together, so one run tells you every place to
      # edit. aelix-server is skipped on purpose — it is dropped from the
      # publish set below and its inter-package deps are deliberately unpinned.
      - name: Assert the tag matches every published version and pin
        id: pin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging --python 3.12 python - <<'PY'
          import glob
          import os
          import sys
          import tomllib

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          PUBLISHED = {
              canonicalize_name(n)
              for n in ("aelix", "aelix-ai", "aelix-agent-core", "aelix-coding-agent")
          }

          tag = os.environ["TAG"]
          try:
              want = Version(tag.removeprefix("v"))
          except InvalidVersion as exc:
              print(f"::error::Tag '{tag}' is not a PEP 440 version: {exc}")
              sys.exit(1)

          problems: list[str] = []
          seen: set[str] = set()

          for path in ["pyproject.toml", *sorted(glob.glob("packages/*/pyproject.toml"))]:
              with open(path, "rb") as fh:
                  proj = tomllib.load(fh).get("project", {})
              name = canonicalize_name(proj.get("name", ""))
              if name not in PUBLISHED:
                  continue
              seen.add(name)

              declared = proj.get("version")
              try:
                  if declared is None or Version(declared) != want:
                      problems.append(
                          f"{path}: project.version is {declared!r}, expected {want}"
                      )
              except InvalidVersion:
                  problems.append(f"{path}: project.version {declared!r} is not PEP 440")

              # `[project.optional-dependencies]` pins count too: the root's
              # `tui` extra pins `aelix-coding-agent[tui]==X`, and a bump that
              # missed it would ship `pip install 'aelix[tui]'` demanding a
              # version that is not on the index (#142-1).
              extras = proj.get("optional-dependencies", {})
              declared_deps = [
                  *proj.get("dependencies", []),
                  *(dep for group in extras.values() for dep in group),
              ]
              for dep in declared_deps:
                  try:
                      req = Requirement(dep)
                  except Exception:  # noqa: BLE001 — a bad requirement is itself the problem
                      problems.append(f"{path}: dependency {dep!r} does not parse")
                      continue
                  if canonicalize_name(req.name) not in PUBLISHED:
                      continue
                  pins = [s.version for s in req.specifier if s.operator == "=="]
                  if not pins:
                      problems.append(
                          f"{path}: dependency on {req.name} is not pinned with '==' ({dep!r}); "
                          "the published set must install lock-step"
                      )
                      continue
                  try:
                      if Version(pins[0]) != want:
                          problems.append(
                              f"{path}: pins {req.name}=={pins[0]}, expected {want}"
                          )
                  except InvalidVersion:
                      problems.append(f"{path}: pin {dep!r} is not a PEP 440 version")

          for missing in sorted(PUBLISHED - seen):
              problems.append(f"published package {missing!r} has no pyproject.toml on disk")

          if problems:
              print(
                  f"::error::Tag '{tag}' normalizes to '{want}', but the workspace "
                  f"disagrees in {len(problems)} place(s). Bump every published "
                  "package AND every inter-package pin (see RELEASING.md), or "
                  "retag; refusing to build a mismatched release."
              )
              for problem in problems:
                  print(f"::error::  {problem}")
              sys.exit(1)

          print(
              f"Tag '{tag}' (normalized {want}) matches all {len(seen)} published "
              "versions and every inter-package pin."
          )
          # Only now, so no job downstream can read a version this step refused.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={want}\n")
          PY

      # The interpreter request install.sh / install.ps1 Step 5 make for this
      # version - python_request_for / Get-PythonRequest (#278, ADR-0265):
      # '>=3.11,<3.15' for 0.1.0b3 and later, '>=3.11,<3.14' for anything older
      # or not provably newer (a dev, post or local version). The script's rule
      # is held equal to both installers' by tests/test_release_candidate_smoke.py,
      # so the smoke asks uv for what a user's installer asks for this version.
      - name: The interpreter request the installers make for this version
        id: request
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          request="$(uv run --no-project --python 3.12 python -I scripts/release_candidate_smoke.py request --version "$VERSION")"
          echo "Interpreter request for $VERSION: $request"
          echo "python_request=$request" >> "$GITHUB_OUTPUT"

      - name: Build all workspace packages
        run: uv build --all-packages --out-dir dist

      - name: Drop aelix-server artifacts (excluded from v1 publish set)
        run: |
          # aelix-server is the deferred Web-UI daemon (v1.1). Remove its
          # sdist + wheel so only the v1 publish set is uploaded to PyPI:
          #   aelix-ai, aelix-agent-core, aelix-coding-agent, aelix
          rm -f dist/aelix_server-*.whl dist/aelix_server-*.tar.gz
          echo "Artifacts to publish:"
          ls -1 dist

      - name: Generate SHA256SUMS over the publish set
        working-directory: dist
        run: |
          # aelix-server was dropped above → this manifest lists ONLY the
          # 4 published wheels + 4 sdists that github-release/install.sh consume.
          sha256sum *.whl *.tar.gz > SHA256SUMS
          echo 'Release checksums:'; cat SHA256SUMS

      - name: Upload distributions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── The candidate, installed and run before anything is published (#382) ──
  # Until #382 nothing installed the artifact this workflow publishes. ci.yml's
  # install-sh-e2e / install-ps1-e2e jobs install the NEWEST PUBLISHED Release,
  # so they meet a candidate only after users can, and RELEASING.md checked the
  # installer only after `publish` - a defect found there costs the version
  # number on PyPI, which never takes a file name twice (ADR-0240). And
  # `github-release` needed only `build`, while install.sh / install.ps1 with
  # no AELIX_VERSION take the newest Release tag, betas included: a candidate
  # nobody had installed was every user's default the moment that job ran.
  #
  # pi's order (build-binaries.yml at fdce48eb4, owner decision 2026-10-20 on
  # #382): build -> smoke on ubuntu/macos/windows -> stage the GitHub Release
  # (needs build + smoke) -> publish (needs the Release, environment approval).
  # Diverges in one place, knowingly: pi stages a DRAFT Release and makes it
  # public only after npm. A draft's assets are not downloadable by the
  # installers, and the approval window RELEASING.md uses runs install.sh /
  # install.ps1 against this very Release, so it is public (pre-release for a
  # hyphenated tag) once the smoke passed.
  #
  # What runs: THIS run's `dist` artifact, installed the way the installers'
  # Step 5 installs a Release (see the install step), on every OS they serve;
  # then scripts/release_candidate_smoke.py under the tool environment's own
  # interpreter. `installed`: the request is the installers' for this version,
  # SHA256SUMS is in the form sha256sum writes (stricter than install.sh: it
  # refuses every form install.sh refuses, and more), holds for every file and names
  # the tag's version where install.sh reads it, the interpreter is inside the
  # request and is the CPython uv downloaded, every file of every first-party
  # wheel (its .dist-info too) is installed byte for byte (a PyPI file of the
  # same version standing in for the candidate goes red), every top-level
  # package and the TUI import. `turn`: `aelix --version` prints the tag's
  # version, and `aelix --offline -p` with a fake key runs one turn against a
  # stub on 127.0.0.1 from scratch HOME / AELIX_* directories - the console
  # script through settings, models.json, the OpenAI client, SSE and the agent
  # loop; the stub must see exactly one request of any method. The turn also
  # writes a session, which the script reports but does not require. The
  # script's docstring says why `-p` rather than `--list-models`.
  #
  # Nothing here may turn a red leg green: no `continue-on-error` (job or
  # step), no step `if:` but the per-OS uv bootstrap pair, and no `if:` with a
  # status function (always(), !cancelled(), ...) on github-release or publish.
  # tests/test_release_candidate_smoke.py holds all three.
  candidate-smoke:
    name: Smoke-test the candidate (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Bounded like every ci.yml job (#429): one uv bootstrap, one install (a
    # CPython download included - only-managed, below), two short aelix runs.
    # The install and both checks took under 10 s locally with a warm uv cache
    # (macOS, 2026-10-20); a hung download must not sit six hours in front of
    # the Release.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # A red windows leg must not cancel the macOS one: each OS is a finding.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # bash on every OS, windows included (Git Bash), so each step is one script
    # rather than a bash and a pwsh copy; `shell: bash` is `bash --noprofile
    # --norc -eo pipefail {0}`, so a failing command fails its step. The one
    # step that needs PowerShell says so itself.
    defaults:
      run:
        shell: bash
    env:
      # The version the build job proved equal to the tag and to every
      # published pyproject (its `pin` step), PEP 440 spelled: 0.1.0b3.
      VERSION: ${{ needs.build.outputs.version }}
      # The interpreter request both installers make for VERSION (build's
      # `request` step): '>=3.11,<3.15' for 0.1.0b3 and later, '>=3.11,<3.14'
      # for older or unparseable versions (ADR-0265).
      PYTHON_REQUEST: ${{ needs.build.outputs.python_request }}
    steps:
      - name: Checkout (the smoke script, at the tagged commit)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # This job runs code from PyPI and from the candidate; leave no token
          # in .git/config for it to find.
          persist-credentials: false

      - name: Download distributions artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/candidate-dist

      - name: Scratch locations (outside the checkout, as a user's are)
        run: |
          {
            echo "DIST=$RUNNER_TEMP/candidate-dist"
            echo "UV_TOOL_DIR=$RUNNER_TEMP/candidate-tools"
            echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/candidate-bin"
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/candidate-python"
          } >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/candidate-dist"

      # uv as the installers' Step 2 gets it on a machine without one: Astral's
      # installer, newest uv. Not astral-sh/setup-uv: that action verifies
      # nothing past uv 0.11.18 without a `checksum:` per runner OS (#393,
      # tests/test_ci_uv_pin.py), and none is on record for macOS. This job
      # publishes nothing and holds no secret, so its uv decides what the smoke
      # sees, never what ships; ci.yml's e2e jobs bootstrap uv the same way. The
      # Astral installer appends its directory to GITHUB_PATH on a runner.
      - name: Install uv (POSIX - the bootstrap install.sh Step 2 runs)
        if: runner.os != 'Windows'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install uv (Windows - the bootstrap install.ps1 Step 2 runs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://astral.sh/uv/install.ps1 | iex

      # install.sh / install.ps1 Step 5 with THIS run's wheels where they put a
      # Release's verified ones: --find-links ADDS them and PyPI stays the index
      # for third-party dependencies (never --no-index); `==$VERSION` keeps a
      # newer PyPI `aelix` from outranking them; `aelix[tui]` is the installers'
      # default extra; --python is their request for this version. From
      # $RUNNER_TEMP, not the checkout: a user's working directory is not this
      # repository.
      #
      # WHICH INTERPRETER. With uv's defaults the runner's own Python wins
      # whenever one is inside the request (python-preference `managed` takes a
      # Python on PATH before it downloads one: measured with uv 0.13.4, a box
      # with 3.11 and 3.12 on PATH got 3.12.13 for '>=3.11,<3.15'). A user with
      # no Python in range gets a download instead: the newest CPython inside the
      # request (3.14.8 for '>=3.11,<3.15', 3.13.16 for '>=3.11,<3.14', same
      # uv). only-managed into an empty UV_PYTHON_INSTALL_DIR gives every leg
      # that same download - on the box above too - and `installed` checks the
      # environment is based on it. ci.yml's source-tree legs keep covering
      # 3.11-3.14 on ubuntu and windows.
      - name: Install the candidate as the installers do (local wheels + PyPI for the rest)
        working-directory: ${{ runner.temp }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
          UV_PYTHON_DOWNLOADS: automatic
        run: |
          : "${VERSION:?build.outputs.version is empty}" "${PYTHON_REQUEST:?build.outputs.python_request is empty}"
          printf 'uv: %s (%s)\n' "$(command -v uv)" "$(uv --version)"
          uv tool install --force --find-links "$DIST" --python "$PYTHON_REQUEST" "aelix[tui]==$VERSION"
          case "$RUNNER_OS" in
            Windows) echo "CANDIDATE_PYTHON=$UV_TOOL_DIR/aelix/Scripts/python.exe" >> "$GITHUB_ENV" ;;
            *) echo "CANDIDATE_PYTHON=$UV_TOOL_DIR/aelix/bin/python" >> "$GITHUB_ENV" ;;
          esac

      - name: The environment holds the candidate's own bytes, and every package imports
        working-directory: ${{ runner.temp }}
        run: '"$CANDIDATE_PYTHON" -I "$GITHUB_WORKSPACE/scripts/release_candidate_smoke.py" installed --dist "$DIST" --version "$VERSION" --python-request "$PYTHON_REQUEST" --managed-python-dir "$UV_PYTHON_INSTALL_DIR"'

      - name: aelix --version, then one turn through the console script (fake key, local stub, no network)
        working-directory: ${{ runner.temp }}
        run: '"$CANDIDATE_PYTHON" -I "$GITHUB_WORKSPACE/scripts/release_candidate_smoke.py" turn --bin-dir "$UV_TOOL_BIN_DIR" --version "$VERSION" --scratch "$RUNNER_TEMP/candidate-turn"'

  publish:
    name: Publish to PyPI (Trusted Publishing)
    # After the candidate ran on every OS AND its Release exists (#382,
    # ADR-0269; pi's publish-npm needs its staged Release the same way). The
    # `pypi` approval below is therefore asked for only once the Release is up,
    # which is the window RELEASING.md uses to run install.sh / install.ps1
    # with AELIX_VERSION=<tag> before approving. `candidate-smoke` is listed
    # although `github-release` already needs it, so dropping that edge cannot
    # quietly ungate the irreversible upload.
    needs: [build, candidate-smoke, github-release]
    # Pre-release tags publish too (ADR-0240). Until beta.2 this job carried
    # `if: !contains(github.ref_name, '-')` so a hyphenated tag never started
    # it. That gate left the four PyPI names holding only the `0.0.0a0`
    # placeholders — and pip/uv, seeing nothing but pre-releases, install the
    # newest one, so `uv tool install aelix` fetched a placeholder that shadowed
    # a working install (measured in update_check.py's header). A PEP 440
    # pre-version (`v0.1.0-beta.2` → `0.1.0b2`) is invisible to a plain
    # `pip install aelix` once any stable exists, so publishing it closes the
    # trap without pre-empting GA. The tag gate above still refuses dot-form
    # pre-releases, and `skip-existing: false` still makes a re-run of the
    # same version fail loudly instead of silently uploading nothing.
    runs-on: ubuntu-latest
    # GitHub Environment adds an approval/protection gate around the
    # publish step. The maintainer references this same environment name
    # ("pypi") when configuring the PyPI Trusted Publisher (see header).
    environment:
      name: pypi
      url: https://pypi.org/project/aelix/
    permissions:
      # OIDC: mint a short-lived token for Trusted Publishing. This is the
      # ONLY elevated permission, and it replaces any stored API token.
      id-token: write
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Drop non-distribution files before upload
        run: rm -f dist/SHA256SUMS
        # twine check/upload rejects SHA256SUMS ('Unknown distribution format');
        # it belongs only on the GitHub Release, never on PyPI.

      # v1.14.0 bundled twine 6.1.0 + packaging 25.0, and its `twine check`
      # runs BEFORE the upload. hatchling emits `Metadata-Version: 2.5`, which
      # that packaging does not know, so the very first release to reach this
      # step died on
      #     InvalidDistribution: '2.5' is not a valid metadata version
      # (run 34310880829, tag v0.1.0-beta.2) with nothing uploaded. PyPI itself
      # accepts 2.5 — hatchling 1.32.0 is on the index carrying it — so the
      # stale check was the whole failure. v1.14.2 bundles twine 7.0.0 +
      # packaging 26.2 and accepts it.
      #
      # 🔴 A LOCAL `twine check` DOES NOT PREDICT THIS STEP. The rehearsal for
      # beta.2 ran `uv run --with twine`, resolved twine 7.0.0, passed 8/8, and
      # said nothing about the 6.1.0 the action would actually use. If you
      # rehearse, pin the twine in `requirements/runtime.txt` at the action ref
      # pinned below.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # No `password:` — Trusted Publishing (OIDC) is used instead.
          # Generate + upload PEP 740 build provenance attestations (uses the
          # same OIDC id-token; no extra secret). Defense-in-depth between
          # build and publish.
          attestations: true
          # Fail loudly if a build is somehow already on PyPI rather than
          # silently skipping.
          skip-existing: false
          print-hash: true

  github-release:
    name: Publish GitHub Release (wheels + SHA256SUMS + SBOM)
    # Not before the candidate ran on every OS (#382, ADR-0269): install.sh and
    # install.ps1 with no AELIX_VERSION install the newest Release tag, betas
    # included, so this job is what makes a build every user's default.
    needs: [build, candidate-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release + upload assets (ONLY elevation here)
    steps:
      - name: Checkout (for the committed SBOM + CHANGELOG + tag history)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history + all tags: the release-notes step below picks the
          # PREVIOUS release tag to scope the auto-generated changelog. The
          # default shallow checkout fetches no tags, so that lookup would
          # silently find none and every release would be treated as the first.
          fetch-depth: 0
      - name: Download distributions artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # ── Release notes (#111 B-6) ──────────────────────────────────────────
      # Previously this job passed `--generate-notes` alone. That asks GitHub to
      # diff against the previous tag — and when there is no previous tag it
      # scrapes EVERY merged PR since the repository began, so the first release
      # page (the one the announcement links to) becomes a hundred-PR dump and
      # the hand-written CHANGELOG is never shown.
      #
      # The notes body is now composed explicitly, in two parts, so the rule
      # holds for the first tag AND for every tag after it:
      #
      #   1. the CHANGELOG.md section for exactly this version — always;
      #   2. GitHub's generated "What's Changed" — ONLY when a previous tag
      #      exists, and explicitly scoped to it via `previous_tag_name`.
      #
      # `--generate-notes` is deliberately NOT used: composing the body here is
      # what lets part 2 be omitted on the first release and bounded on later
      # ones. The final `gh release create` always gets a `--notes-file`.
      - name: Compose release notes (CHANGELOG section + scoped changelog)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"

          # (1) The hand-written section. Tag `vX.Y.Z[-pre]` maps to the heading
          # `## [X.Y.Z[-pre]]`. Matching includes the closing bracket, so the tag
          # v0.1.0 can never absorb the section for 0.1.0-beta.1. Extraction
          # stops at the next `## ` heading; `### ` subheadings are preserved.
          version="${TAG#v}"
          section="$RUNNER_TEMP/changelog-section.md"
          if awk -v ver="$version" '
                BEGIN { hdr = "## [" ver "]" }
                substr($0, 1, 3) == "## " {
                  if (found) { exit }
                  if (substr($0, 1, length(hdr)) == hdr) { found = 1 }
                  next
                }
                found { print }
                END { if (!found) exit 3 }
              ' CHANGELOG.md > "$section" && [ -s "$section" ]; then
            # Drop leading blank lines so the release body starts on text.
            sed '/./,$!d' "$section" >> "$notes"
            echo "Using the CHANGELOG.md section for [$version]."
          else
            echo "::warning::CHANGELOG.md has no '## [$version]' section; the release notes will carry only the generated commit log. Add the section and edit the release."
          fi

          # (2) The previous release tag = the highest tag strictly BELOW this
          # one, taken as the entry that follows $TAG in the descending list
          # (not merely "the newest other tag", which would make a back-port
          # like v0.1.1 diff against a newer v0.2.0 and emit a reversed
          # changelog). `versionsort.suffix` teaches git that a pre-release
          # sorts before its final release, so v0.1.0-beta.1 < v0.1.0 < v0.2.0
          # < v0.10.0. Empty output ⇒ nothing precedes this tag ⇒ first release.
          prev="$(git -c versionsort.suffix=-alpha \
                      -c versionsort.suffix=-beta \
                      -c versionsort.suffix=-rc \
                      tag --list 'v*' --sort=-v:refname \
                  | awk -v t="$TAG" 'found { print; exit } $0 == t { found = 1 }')"

          if [ -n "$prev" ]; then
            echo "Previous release tag: $prev — appending the scoped changelog."
            # Blank-line separator only when part 1 actually wrote something,
            # so a missing CHANGELOG section does not open the body with one.
            # Written as an `if` on purpose: `[ -s … ] && …` would make the step
            # exit non-zero under `set -e` on the empty-section path.
            if [ -s "$notes" ]; then printf '\n' >> "$notes"; fi
            gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$prev" \
              --jq '.body' >> "$notes"
          else
            echo "No previous tag — this is the first release; skipping the generated changelog (it would list the entire repository history)."
          fi

          # Never publish an empty release body. If BOTH parts came up empty
          # (no CHANGELOG section on a first release), fall back to the
          # unscoped generated notes rather than shipping a blank page.
          if [ ! -s "$notes" ]; then
            echo "::warning::No CHANGELOG section and no previous tag; falling back to unscoped generated notes."
            gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' > "$notes"
          fi

          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          echo "--- release notes (first 40 lines) ---"
          head -n 40 "$notes"

      - name: Create GitHub Release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          prerelease=""
          case "$tag" in *-*) prerelease='--prerelease';; esac
          # `gh release edit` only touches the flags it is given, so the empty
          # string that means "not a pre-release" on `create` would mean "leave
          # the flag alone" on `edit` — a GA tag updating a page left over from
          # a pre-release run would silently keep the pre-release badge. The
          # edit path therefore always states the value explicitly.
          prerelease_edit='--prerelease=false'
          case "$tag" in *-*) prerelease_edit='--prerelease=true';; esac

          # The SBOM was attached via a bare glob. An unmatched glob would be
          # passed through to `gh` as the literal string `sbom/aelix-*.cdx.json`
          # (a confusing upload failure), and a glob matching SEVERAL files
          # would quietly attach all of them — the SBOM filename carries the
          # version (`aelix-0.1.0b1.cdx.json`), so a stale copy left behind by
          # a version bump is exactly how that happens. Require exactly one.
          shopt -s nullglob
          sboms=(sbom/aelix-*.cdx.json)
          shopt -u nullglob
          if [ "${#sboms[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 SBOM matching 'sbom/aelix-*.cdx.json', found ${#sboms[@]}: ${sboms[*]:-(none)}. Regenerate the SBOM (scripts/) and remove any stale copies."
            exit 1
          fi

          # Exactly one file is not the same as the RIGHT file. The SBOM name
          # carries the version, so a bump that regenerates nothing leaves a
          # single, perfectly well-formed SBOM describing the PREVIOUS release —
          # count==1 passes and the release ships a bill of materials for the
          # wrong artifacts. Read the expected version from pyproject.toml,
          # which the build job already proved equals the tag.
          sbom_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          expected_sbom="sbom/aelix-${sbom_version}.cdx.json"
          if [ "${sboms[0]}" != "$expected_sbom" ]; then
            echo "::error::SBOM '${sboms[0]}' does not match this release: expected '$expected_sbom' (version $sbom_version). Regenerate the SBOM for this version and remove the stale one."
            exit 1
          fi
          echo "SBOM: ${sboms[0]}"

          # Create, or update in place if the Release already exists.
          #
          # `gh release create` fails outright on a name that is taken, and this
          # job is reachable a second time for the same tag: the publish job can
          # fail on its own (it did — run 34310880829 died in `twine check`
          # while THIS job succeeded), and the fix is to retag, which replays
          # every job. Without this branch the replay that finally publishes to
          # PyPI also reports a failed Release job, so the run that did the
          # right thing looks red. Assets are re-uploaded with --clobber
          # because a rebuild produces the same names, and `gh release edit`
          # rewrites the notes so a corrected CHANGELOG reaches the page.
          #
          # `--clobber` deletes each same-named asset before uploading its
          # replacement, and it uploads concurrently, so a failure partway
          # through leaves the live page missing the assets it had already
          # deleted. That damage is visible (the job goes red) rather than
          # masked, and the next run restores them from the same build
          # artifact — but it is real, so do not reach for this path to make a
          # cosmetic edit. Assets the rebuild does NOT produce are left alone;
          # only names that collide are replaced.
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — updating it in place."
            gh release upload "$tag" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              "${sboms[0]}" \
              --repo '${{ github.repository }}' \
              --clobber
            gh release edit "$tag" \
              --repo '${{ github.repository }}' \
              --title "$tag" \
              --notes-file "$NOTES_FILE" \
              "$prerelease_edit"
          else
            gh release create "$tag" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              "${sboms[0]}" \
              --repo '${{ github.repository }}' \
              --title "$tag" \
              --notes-file "$NOTES_FILE" \
              $prerelease
          fi
