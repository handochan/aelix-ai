name: CI

# Continuous integration for the Aelix uv workspace.
#
# Runs on every push and pull request: lint (ruff check) and the test gate
# (pytest) across the supported Python versions.
#
# Note: ``ruff format --check`` is intentionally NOT enforced — the codebase is
# hand-formatted for readability (pi-parity annotations, multi-line calls), which
# the opinionated ``ruff format`` would collapse. ``ruff check`` (the linter)
# remains the style gate. See ADR-0152.
#
# Third-party actions are PINNED to a commit SHA (supply-chain hardening);
# the trailing comment records the human-readable release tag.

on:
  push:
    branches: ["**"]
  pull_request:

# Minimal permissions: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # #103 P0-b: the windows leg GATES since 2026-09-04. It was advisory
    # while it was a measurement; run 33853043685 (beffc2f) closed that at
    # 0 failed / 9338 passed / 71 skipped on py3.11 and py3.12, down from the
    # 433 it opened at. Leaving `continue-on-error` on now would mean the next
    # `fcntl` import lands green — the exact regression this leg was added to
    # stop. A green leg that cannot fail is not a measurement either.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # ADR-0197 (P2): the kernel-untouched gate resolves
          # `git merge-base origin/main HEAD` to diff the branch against its
          # merge base. The action's default is a depth-1 shallow clone with no
          # other refs, so that command errors and the test can only skip. Full
          # history keeps the git-range adjunct meaningful; the primary gate is
          # the content grep, which needs no history at all.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Pin uv itself for reproducible CI; bump deliberately.
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages

      - name: Lint (ruff check)
        run: uv run ruff check .

      # Not a bare `uv run pyright`: this gate spent its whole life analysing 8
      # of 247 files because an include glob matched nothing, and a gate that
      # sees nothing reports zero errors and looks clean. check_types.py asserts
      # `filesAnalyzed` as well as the error count, and separately asserts that
      # `scripts/pyright_spike.py` STILL fails — its three inverse cases are
      # negative assertions, so silence there is a narrowing regression in the
      # hook API. See ADR-0213.
      #
      # #103 P0-b: this step was advisory on windows because it aborted that
      # leg at step 6 of 7 and the measurement produced no test numbers at
      # all. It gates on both platforms since 2026-09-04. Its 15 errors were
      # POSIX-only names (`fcntl.flock`, `os.getuid`, `pty.openpty`) seen only
      # because `pythonPlatform` follows the HOST; they are suppressed at the
      # sites now. Do NOT pin `pythonPlatform` to Linux to make this quiet —
      # that turns this run into a duplicate of the ubuntu one and hides the
      # Windows-model type errors it is here to catch.
      - name: Type gate (pyright)
        run: uv run python scripts/check_types.py

      - name: Test gate (pytest)
        run: uv run pytest -p no:cacheprovider -q

  # install.ps1 has no coverage that executes it (#106). Its only gate was
  # tests/packaging_gate/test_install_ps1_parity.py, which is regex over text —
  # it proves the script has not DRIFTED from install.sh, never that it runs.
  # This job runs the documented one-liner end to end against the published
  # release, on both Windows hosts, and GATES from the first green run: an
  # advisory leg here would let a broken installer ship green, which is the
  # exact failure #103's comment above describes.
  #
  # Deliberately NOT astral-sh/setup-uv. `grep -iE '\buv\b|astral'` over
  # actions/runner-images images/windows/Windows2025-Readme.md (windows-latest
  # → Windows Server 2025) and Windows2022-Readme.md returns Miniconda/Pipx and
  # nothing else, so uv is absent and install.ps1's Step 2 bootstrap runs for
  # real. The "uv must be absent" step below asserts that premise instead of
  # assuming it — the day GitHub adds uv to the image, the bootstrap branch goes
  # dead in CI and this job must say so rather than quietly measuring half of
  # Step 2. The second install pass covers the other half.
  #
  # The first execution (run 33862346729, commit 74008b6) came back red on BOTH
  # hosts, on install.ps1's own Step 2, and neither defect was reachable by the
  # regex parity test: on pwsh, `(Invoke-WebRequest ...).Content` was a byte[]
  # because the astral.sh 200 carries no Content-Type; on Windows PowerShell
  # 5.1, an em dash inside a string became a smart quote under ANSI decoding
  # and the file would not parse at all. Both are fixed in install.ps1 in this
  # same commit. That run is the whole argument for this job.
  install-ps1-e2e:
    name: install.ps1 e2e (${{ matrix.shell }})
    runs-on: windows-latest
    # The documented one-liner spells `powershell`, i.e. Windows PowerShell 5.1
    # — the host whose default SecurityProtocol can still be TLS 1.0 and whose
    # Invoke-WebRequest wants the IE engine, which is why install.ps1 Step 0's
    # `SecurityProtocol` TLS 1.2 opt-in and the `-UseBasicParsing` flag in
    # `Get-File` exist. pwsh (7.6.5 on the image) is the host a developer more
    # likely has. Neither one alone tests the promise.
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    # `shell:` on an individual step does NOT appear in the Actions context
    # availability table (only steps.env/if/name/run/with/... do), and
    # actionlint confirms it: `${{ matrix.shell }}` there resolves against no
    # context at all. `defaults.run.shell` DOES list `matrix`, so the matrix
    # selection lives here once instead of on every step.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        # Shallow on purpose: this job executes one file at the tip. The
        # fetch-depth: 0 in the test job is for the merge-base gate, which does
        # not run here.

      - name: Record the host
        run: |
          $PSVersionTable | Format-List | Out-String | Write-Host
          Write-Host "ExecutionPolicy: $(Get-ExecutionPolicy -List | Out-String)"

      - name: uv must be ABSENT (the Step 2 bootstrap is the point)
        run: |
          $uv = Get-Command uv -ErrorAction SilentlyContinue
          if ($uv) {
            Write-Host "::error::uv is preinstalled at $($uv.Source). install.ps1 Step 2's bootstrap arm is now dead in CI and only the 'uv already installed' arm is measured. Strip it from PATH in this step, or record in this job's comment that the bootstrap is no longer covered."
            exit 1
          }
          Write-Host "uv absent - install.ps1 Step 2 will bootstrap it."

      # The documented invocation, from the CHECKED-OUT file. `irm <url> | iex`
      # would fetch main and test the wrong bytes: a branch that breaks
      # install.ps1 has to go red on that branch. `-Raw` is load-bearing —
      # without it Get-Content emits a string[] and the pipeline hands iex ONE
      # LINE AT A TIME, which evaluates each line in its own parse and breaks
      # every multi-line try/function/if in the file. `irm` returns one string;
      # `-Raw` is its faithful analogue.
      #
      # Nothing else belongs in this step. install.ps1 aborts with `exit 1`
      # (Stop-WithError), iex runs in the caller's scope, so that exit
      # terminates the HOST — which is what a user gets from
      # `powershell -c "irm ... | iex"`, and what makes the step's own process
      # exit code 1 without depending on $LASTEXITCODE propagation. Any command
      # placed after the pipe here would be unreachable on the failure path.
      #
      # No `-Encoding` on Get-Content, deliberately, and it is what makes this
      # leg STRICTER than the documented one-liner. Windows PowerShell 5.1
      # decodes a BOM-less file as the ANSI code page (CP1252 on this image);
      # pwsh 7 defaults to UTF-8, and `irm` is handed `charset=utf-8` by
      # raw.githubusercontent.com, so both of those decode install.ps1
      # correctly whatever bytes it holds. Pinning utf8 here would blind the
      # leg to the exact defect it found on its first run: a UTF-8 em dash in a
      # string whose 0x94 byte is a smart quote in CP1252, which closed the
      # string early and broke the parse (run 33862346729, job 100989402525).
      # install.ps1 is ASCII-only now and
      # tests/packaging_gate/test_install_ps1_parity.py holds it there; this
      # step is the half of that gate that runs on a host which cares.
      - name: Install (pass 1 - uv bootstrap arm)
        env:
          # 60/hr unauthenticated is PER IP and the runner pool shares
          # addresses; install.sh's Step 3 `die` message already names this as the usual 403.
          # install.ps1 sends it as Bearer to api.github.com only — Get-File
          # carries no header, so it never reaches objects.githubusercontent.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: Get-Content -Raw install.ps1 | Invoke-Expression

      - name: Assert what the script promised (pass 1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& ./.github/scripts/assert-install-ps1.ps1'

      # Step 2's OTHER arm. uv is on PATH now, so this pass takes
      # `if (Test-Have 'uv')` — dead code in every other run of this job — and
      # it is also the "re-run to upgrade" path getting-started.md documents,
      # whose idempotence install.ps1 Step 5's `--force` comment claims.
      - name: Install (pass 2 - uv-already-present arm, idempotence)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: Get-Content -Raw install.ps1 | Invoke-Expression

      - name: Assert what the script promised (pass 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& ./.github/scripts/assert-install-ps1.ps1'
