name: measure-446-r3

# Throwaway measurement for #446 review round 2 (never merges; ci.yml is removed on this branch only).
# Product files are exactly e24ea2e8's (the identity step proves it); the test file is the amended fix.
#   rounds : the amended deadline arm, 100 rounds per python x load none / cpu3 (three busy loops) /
#            cpu4 (four, every vCPU busy), each round's witness record, rule answer and kill check.
#   file   : the whole test file once per python (unloaded), then the five tests this round adds x5.
#   sab    : the defect classes and wrong forms of the change on win32, each row three times, and
#            the CI-visible tests under each wrong version the verify pass listed.

on:
  push:
    branches: ["measure/**"]

permissions:
  contents: read

jobs:
  rounds:
    name: r3 rounds (py${{ matrix.python-version }}, load=${{ matrix.load }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        load: ["none", "cpu3", "cpu4"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          checksum: "75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages
      - name: Identity
        shell: bash
        run: |
          mkdir -p out
          { git rev-parse HEAD; git log --oneline -2;
            echo "diff vs e24ea2e8 outside .github, .omc-446 and the rounds driver:";
            git diff --stat e24ea2e84a818e55c36ccbb839e279ea97220acb HEAD -- . ':!.github' ':!.omc-446' ':!tests/tools/test_measure_446_r3.py'; echo "(end)";
            sha256sum tests/tools/test_bash_tool_containment.py;
            .venv/Scripts/python.exe -VV; echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"; } | tee out/identity.txt
      - name: Rounds
        shell: bash
        env:
          M446_ROUNDS: "100"
          M446_LOAD: ${{ matrix.load }}
        run: |
          export M446_OUT="$PWD/out/rounds.jsonl"
          n=0
          if [ "${{ matrix.load }}" = "cpu3" ]; then n=3; fi
          if [ "${{ matrix.load }}" = "cpu4" ]; then n=4; fi
          for k in $(seq 1 $n); do .venv/Scripts/python.exe -c "while True: pass" & done
          if [ "$n" -gt 0 ]; then sleep 2; fi
          rc=0
          timeout -k 10 4800 .venv/Scripts/python.exe -m pytest -p no:cacheprovider -q -rfE -W always::UserWarning tests/tools/test_measure_446_r3.py > out/pytest.txt 2>&1 || rc=$?
          echo "pytest rc=$rc :: $(tail -1 out/pytest.txt)" | tee out/rc.txt
          LC_ALL=C grep -a -E '^(FAILED|ERROR) ' out/pytest.txt | cut -c1-400 | tee -a out/rc.txt || true
          git status --short | tee out/status.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-rounds-py${{ matrix.python-version }}-${{ matrix.load }}
          path: out/
          retention-days: 30

  file:
    name: r3 file (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          checksum: "75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages
      - name: Whole file, then the new tests five times
        shell: bash
        run: |
          mkdir -p out
          sha256sum tests/tools/test_bash_tool_containment.py | tee out/identity.txt
          rc=0
          timeout -k 10 1200 .venv/Scripts/python.exe -m pytest -p no:cacheprovider -q -rfE -W always::UserWarning tests/tools/test_bash_tool_containment.py > out/file.txt 2>&1 || rc=$?
          echo "whole file rc=$rc :: $(tail -1 out/file.txt)" | tee out/rc.txt
          for k in 1 2 3 4 5; do
            rc=0
            timeout -k 10 600 .venv/Scripts/python.exe -m pytest -p no:cacheprovider -q -rfE -W always::UserWarning tests/tools/test_bash_tool_containment.py -k "8a_ or 8as_premise or witness_looks or rounding_tie" > out/new-$k.txt 2>&1 || rc=$?
            echo "new tests run $k rc=$rc :: $(tail -1 out/new-$k.txt)" | tee -a out/rc.txt
          done
          git status --short | tee out/status.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-file-py${{ matrix.python-version }}
          path: out/
          retention-days: 30

  sab:
    name: r3 sab (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          checksum: "75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages
      - name: Rows
        shell: bash
        run: |
          mkdir -p out
          git rev-parse HEAD | tee out/identity.txt
          bash .omc-446/sab_win_r3.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-sab-py${{ matrix.python-version }}
          path: out/
          retention-days: 30
