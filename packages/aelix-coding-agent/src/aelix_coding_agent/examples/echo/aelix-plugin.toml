# The reference `aelix-plugin.toml` (ADR-0096, manifest v1).
#
# This one is REAL: it describes the `echo` example sitting next to it, the
# loader parses it, and a test asserts it stays valid. Copy this file, change
# the values, delete what you do not contribute.
#
# WHEN IT IS READ: a manifest is picked up when your plugin directory is a
# SUBDIRECTORY of a scanned extensions directory. Three spellings scan a
# directory, and all three read this file:
#   * `./.aelix/extensions/echo/`      (project-local, auto — Project Trust gated)
#   * `~/.aelix/agent/extensions/echo/` (global, auto)
#   * `-e <parent>` where <parent> CONTAINS `echo/` — `-e` at a directory makes
#     it a scanned extensions directory: its own `*.py` children load directly
#     AND each subdirectory is resolved through `aelix-plugin.toml` /
#     `pyproject.toml [tool.aelix]` / `__init__.py`.
# There the manifest wins over the legacy `pyproject.toml` and `__init__.py`
# forms (`_resolve_extension_entries` in extensions/loader.py).
# Only `-e <file.py>` and `-e <module>` never consult a manifest — so
# `aelix -e aelix_coding_agent.examples.echo.echo` runs `echo.py` without
# reading a single line of this file, but `-e path/to/examples/` would load
# `echo` THROUGH this manifest.
#
# The schema is `aelix_agent_core.contracts.manifest.PluginManifest` and it is
# STRICT (`extra="forbid"`): an unknown key is a hard validation failure, and a
# directory whose `aelix-plugin.toml` fails to parse is treated as unloadable
# with NO fall-through to the legacy `pyproject.toml` / `__init__.py` forms.
# Every key below is a real key. Do not invent your own — check the schema.
#
# Reading the schema, note that the loader's entry point is
# `parse_manifest_toml`, NOT `PluginManifest.model_validate` on the raw TOML:
# it FLATTENS `[plugin.api]` -> `api` and `[plugin.entry]` -> `entry` first.
# Validating this file directly against `PluginManifest` therefore reports
# "Extra inputs are not permitted" for `plugin.api` / `plugin.entry`. That is
# the flattening, not a defect in this file — use `parse_manifest_toml`.
#
# A manifest is OPTIONAL. A single `.py` file with a top-level `setup(aelix)`
# is a complete extension (`aelix -e ./my_ext.py`, or
# `aelix -e my_pkg.my_ext`). You want a manifest when you need declared
# metadata: lazy activation, contributed commands/tools the host should know
# about before your code runs, declared MCP servers, themes, or subprocess
# hooks.

[plugin]
id = "echo"                       # ^[a-z][a-z0-9-]{0,63}$ — the plugin's identity everywhere
name = "Echo"                     # display name (1-128 chars)
version = "0.1.0"                 # semver: MAJOR.MINOR.PATCH[-pre][+build]
description = "Minimal worked example: one tool and one slash command."
authors = ["Aelix Contributors"]  # at least one
repository = "https://github.com/handochan/aelix-ai"
homepage = "https://github.com/handochan/aelix-ai"   # optional
# SPDX id. The v1 whitelist is
# `aelix_agent_core.contracts.manifest.LICENSE_WHITELIST` — read it there
# rather than trusting a copy in a comment, which is how this line previously
# came to omit `Apache-2.0 WITH LLVM-exception`. Outside the whitelist the
# plugin still loads but the host logs a warning; Phase 6 will gate strictly.
license = "Apache-2.0"

# Host API compatibility. `level` = what you were built against; `min_level` =
# the oldest host you still work on. min_level > host API_LEVEL is a hard
# refusal; level > host API_LEVEL loads with a forward-compat warning.
# The host's current AELIX_API_LEVEL is 1.
[plugin.api]
level = 1
min_level = 1

# What the host imports and calls: "module.path:callable" (pattern
# ^[\w.]+:\w+$). The callable takes one argument, the ExtensionAPI.
# Omit this section entirely for a hooks-only plugin (declared subprocess
# hooks, no Python surface). It becomes REQUIRED as soon as you declare
# capabilities.ui_tui_trusted, .ui_descriptor or .mcp_serve.
#
# ################ READ THIS BEFORE COPYING THIS SECTION ################
# `python` is resolved by a bare `importlib.import_module`, so THE MODULE MUST
# ALREADY BE IMPORTABLE FROM `sys.path`. A plugin directory dropped into
# `./.aelix/extensions/<you>/` is NEVER put on `sys.path`, so a manifest that
# names its own sibling module (`python = "<you>.ext:setup"`) fails at startup
# with `No module named '<you>'`. The value below works only because this
# example ships inside the pip-installed `aelix_coding_agent` package.
#
# For a plain drop-in plugin, pick one of:
#   * pip-install your plugin as a package, then name its real dotted path here;
#   * drop a bare `.py` with a top-level `setup(aelix)` and NO manifest — that
#     is already a complete extension; or
#   * omit `[plugin.entry]` entirely for the hooks-only form.
# #######################################################################
[plugin.entry]
python = "aelix_coding_agent.examples.echo.echo:setup"

# Declared capabilities. Every one defaults to false — declare only what you
# actually need. Listing all nine explicitly (as here) is the honest form for
# a copyable template.
#
# READ THIS BEFORE COPYING: these nine identical `= false` lines mean TWO
# DIFFERENT THINGS. Three are gates the host actually enforces — set them
# wrong and your contribution is refused, with a printed reason. The other six
# are documentation of intent: they are NOT a sandbox, and the host does not
# stop you. A plugin is in-process Python, so `fs_write = false` does not
# prevent `open(path, "w")` — it only states that you do not intend to.
# See ADR-0203 for the per-flag table.
[capabilities]
# --- ENFORCED (the host refuses the contribution if these are false) --------
shell_exec = false        # runs subprocesses.
                          #   REQUIRED by [[contributes.hooks]] and by a stdio
                          #   [[contributes.mcp_servers]] — the host spawns
                          #   your `command`/`args` for you. Declaring the
                          #   contribution without this flag = load refused
                          #   (hooks) / server not started (MCP).
net = false               # makes network calls.
                          #   REQUIRED by an http/sse [[contributes.mcp_servers]]
                          #   — the host dials your `url` for you. It does NOT
                          #   unlock a stdio server; that one needs shell_exec.
ui_tui_trusted = false    # renders in the TUI.
                          #   REQUIRED by [[contributes.tui_widgets]]. Refused
                          #   BEFORE your module is imported.
# --- DECLARED ONLY (documentation of intent — NOT a sandbox, not checked) ---
fs_write = false          # writes outside the workspace
fs_read_user = false      # reads user files outside the workspace
mcp_invoke = false        # calls MCP servers the host has connected
ui_descriptor = false     # emits UI descriptors
ui_web_trusted = false    # renders in the web UI
mcp_serve = false         # exposes its OWN MCP server (forces [plugin.entry]
                          #   python). This is NOT the flag for
                          #   [[contributes.mcp_servers]] — that one tells the
                          #   host to connect OUT to someone else's server and
                          #   is gated on shell_exec / net above.

# When the host loads you. At least one trigger is required and `*` is
# rejected — there is no "always" wildcard.
#   on_startup_finished — eager, at startup
#   on_session_start    — eager, per session
#   on_command = [...]   — LAZY: pure-on_command plugins are not imported until
#                          one of their commands is first used
#   on_tool_call = [...] — eager in v1
# Echo contributes a tool, and declared tools must be visible to the model from
# the first turn, so a tool-contributing plugin is always loaded eagerly no
# matter what it declares here.
[activation]
on_startup_finished = true
on_command = ["hello"]

# What the plugin adds. Each entry must match what setup() actually registers —
# the manifest is a declaration, not an implementation, and the host does not
# create these for you.
[[contributes.commands]]
id = "hello"                      # ^[a-z][a-z0-9-]*$ — the /hello slash command
description = "Sprint 5a demo command — returns a greeting."

[[contributes.tools]]
name = "echo"
description = "Echoes back the provided text."

# ---------------------------------------------------------------------------
# The remaining contribution families, kept commented out because `echo` does
# not contribute them and this manifest must stay true of the code beside it.
# Uncomment and adapt — the key names and value shapes below are exact.
# ---------------------------------------------------------------------------
#
# A declarative TUI widget. `factory` is "module:callable" and is plugin code
# executed in the user's terminal, so capabilities.ui_tui_trusted MUST be true
# or the load is refused before your module is even imported.
# [[contributes.tui_widgets]]
# slot = "status"
# factory = "my_pkg.widgets:build_status_widget"
#
# A theme file, resolved relative to this manifest's directory.
# [[contributes.themes]]
# path = "themes/midnight.toml"
#
# An MCP server the host should connect for you. transport = "stdio" | "http"
# | "sse"; use command+args for stdio, url for http/sse.
#
# CAPABILITY-GATED. transport = "stdio" means the host spawns your `command`
# as a subprocess on its own machine, so capabilities.shell_exec MUST be true
# — the SAME flag [[contributes.hooks]] needs. transport = "http"/"sse" means
# the host opens a connection to your `url`, so capabilities.net MUST be true.
# The flags above default to FALSE: copy this block without flipping one and
# your server is never started (the host prints why). `mcp_serve` is NOT the
# flag for this block.
# [[contributes.mcp_servers]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
# env = { MCP_LOG_LEVEL = "info" }
#
# A subprocess hook. `event` must be one of the eight allowlisted events
# (before_agent_start, input, tool_call, tool_result, user_bash, session_start,
# session_shutdown, agent_end) and capabilities.shell_exec MUST be true.
# timeout_ms is 100..600000, default 60000.
#
# `command` IS SHELL-SPAWNED WITH cwd = THE USER'S PROJECT DIRECTORY, not your
# plugin directory, and there is no plugin-dir variable to interpolate (the
# only env var exported is AELIX_PROJECT_DIR, which is that same user cwd).
# So a RELATIVE command runs THEIR file, not yours: shipping
# `command = "./hooks/audit.sh"` means every repo your users open that happens
# to contain `hooks/audit.sh` gets its script executed on every tool call,
# while your own hook never runs. Use a command the interpreter resolves
# (below) or an absolute path.
# [[contributes.hooks]]
# event = "tool_call"
# command = "python -m my_pkg.hooks.audit"
# timeout_ms = 5000
#
# Descriptors are RESERVED AND INERT (ADR-0184): declaring them only earns a
# warning. Emit descriptors at runtime by subscribing to the ui:list-modules
# probe (ADR-0095).
# [[contributes.descriptors]]
# kind = "panel"
# id = "my-panel"
