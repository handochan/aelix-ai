[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aelix-coding-agent"
version = "0.1.0b1"
description = "Aelix coding agent — ExtensionAPI + built-ins + example tools + TUI. Pi-coding-agent parity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Aelix Contributors" }]
keywords = ["ai", "agent", "llm", "coding-agent", "cli", "tui", "extensions", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Pinned to the shared release version; the workspace sources below are
  # dev-only and stripped from the built metadata.
  "aelix-ai==0.1.0b1",
  "aelix-agent-core==0.1.0b1",
  "pygments>=2.18",
  "markdown-it-py>=3.0",
  "mcp>=1.27,<2",
  "Pillow>=11.0,<12.0",
  # WP-0 (ADR-0158) — tree-sitter-bash AUTO-mode safety classifier. Prebuilt
  # cross-platform wheels (linux/macos/windows), no compiler, ~3.4 MiB. Pinned
  # to one grammar-ABI line so node-type names don't silently drift. The
  # classifier fails safe to ASK if the grammar is unavailable (exotic no-wheel
  # platform → sdist build skipped), so the other four postures are unaffected.
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-bash>=0.25,<0.26",
  # #67 (ADR-0189) — Ed25519 detached-signature provenance for extension packs.
  # Promoted from an incidental transitive dep (via google-auth) to a DIRECT dep:
  # the extension signing/verification path imports it, so a clean install must
  # carry it. In-env at 48.0.0; floor at 42 for the stable Ed25519 API surface.
  "cryptography>=42,<49",
  # #99 — verify TLS against the OS certificate store, not just certifi's
  # public-root bundle. A corporate root CA is installed system-wide, so certifi
  # never sees it and every provider request dies as an opaque "Connection
  # error." while VS Code / Copilot (Node, OS trust store) keep working. Owned by
  # THIS package because ``cli/entry.py`` (the ``aelix`` console script below) is
  # the only importer: the injection rebinds ``ssl.SSLContext`` process-wide, so
  # it belongs to the application entry point and must never be a side effect of
  # importing the aelix-ai provider library. Floor at 0.9 for the
  # ``inject_into_ssl`` API; the CLI degrades to certifi if the import fails.
  "truststore>=0.9",
]

# Sprint 6h₁₀a (ADR-0088 Q1, ADR-0104): the interactive TUI shell is an
# optional extra. `pip install 'aelix-coding-agent[tui]'` pulls in
# prompt-toolkit (input/editor) + rich (output rendering). The entry point
# degrades gracefully with an actionable message when the extra is absent.
[project.optional-dependencies]
tui = [
  "prompt-toolkit>=3.0,<4",
  "rich>=13.7,<15",
]

# There is no `[images]` extra. ADR-0106 §D added one for `tui/images.py`, and
# ADR-0223 removed both: nothing in this package ever called the renderer, so
# `pip install 'aelix-coding-agent[images]'` installed rich-pixels and changed
# no behaviour at all. Inline images are not a shipped feature — see ADR-0223
# for what wiring one would require.

[project.urls]
Homepage = "https://github.com/handochan/aelix-ai"
Repository = "https://github.com/handochan/aelix-ai"
Issues = "https://github.com/handochan/aelix-ai/issues"

# The real `aelix` CLI. The umbrella meta-package re-declares the same
# script (same target) so `uv tool install aelix` works — see the root
# pyproject.toml. Keep the two declarations pointing at the same function.
[project.scripts]
aelix = "aelix_coding_agent.cli.entry:main_sync"

[tool.uv.sources]
aelix-ai = { workspace = true }
aelix-agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
# ADR-0197 (P2): `aelix_agents` is a SECOND top-level import package shipped
# inside this one wheel. It is not a separate distribution on purpose — a new
# dist would have to be threaded through tests/test_license_sync.py,
# tests/test_release_version_consistency.py, scripts/generate_sbom.py,
# RELEASING.md, a new PyPI pending publisher and install.sh, all to enforce a
# boundary tests/agents/test_p2_band_boundaries.py already enforces in code.
# WITHOUT THIS SECOND ENTRY THE EXTENSION IS ABSENT FROM THE WHEEL and
# `from aelix_agents import AgentsExtension` fails for every installed user
# while passing in every source checkout.
#
# #101: `aelix_status` is the THIRD, added on the same reasoning and carrying the
# same hazard. Both entries are guarded by tests that OPEN A BUILT WHEEL
# (tests/status/test_status_wheel.py) rather than reading this list back, because
# a source checkout puts every one of these on sys.path and so cannot tell a
# shipped package from a forgotten one.
packages = [
  "src/aelix_coding_agent",
  "src/aelix_agents",
  "src/aelix_status",
]
# #111 B-7 — developer-state exclusions. This is the package the leak was found
# in: `src/aelix_coding_agent/.omc/state/agent-replay-*.jsonl` (maintainer
# transcript content) plus three OMC state JSONs shipped inside the wheel,
# because the old root-anchored `.omc/state/` .gitignore rule never matched a
# nested path and hatchling had nothing else to go on.
#
# NARROW ON PURPOSE — DO NOT WIDEN, and never to `*.md` / `*.toml` / `*.json`.
# This wheel is a CONTENT carrier. These four must stay in it; the #117
# self-extension signpost cites them by ABSOLUTE PATH, so dropping one does not
# make the product broken, it makes it unshippable — the agent confidently names
# a file the installed tree does not have:
#     aelix_coding_agent/examples/INDEX.md
#     aelix_coding_agent/examples/echo/aelix-plugin.toml
#     aelix_coding_agent/examples/echo/echo.py
#     aelix_coding_agent/extensions/api.py
# tests/packaging/test_build_hygiene.py builds this wheel for real and asserts
# both directions — those four present, `.omc`/`__pycache__` absent. It builds
# from a copy of the repo with .gitignore DELETED, because with .gitignore in
# place the belt suppresses the planted scratch on its own and the assertion
# would pass with this whole list gutted. Verified: gut it and 7 paths leak.
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
  ".env",
  ".env.local",
]

[tool.hatch.build.targets.sdist]
# Same list for the sdist target: the per-package sdist leaked the identical
# `src/aelix_coding_agent/.omc/state/**` paths. Note this sdist DOES carry the
# repo .gitignore at its root, so "the consumer has no .gitignore" is not the
# reason these are here — the reason is that the belt is not what the packaging
# test enforces, and a drifted .gitignore must not be able to re-open the leak.
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
  ".env",
  ".env.local",
]
