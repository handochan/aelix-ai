[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aelix-agent-core"
version = "0.1.0b2"
description = "Aelix agent loop + harness + hook bus. Pi-agent-core parity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Aelix Contributors" }]
keywords = ["ai", "agent", "llm", "agent-loop", "harness", "hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Pinned to the shared release version; the workspace source below is
  # dev-only and stripped from the built metadata.
  "aelix-ai==0.1.0b2",
  # Sprint 6h₁ (ADR-0069, P-216/P-217): prompt-templates frontmatter
  # parsing + skills .gitignore-style ignore matching.
  "PyYAML>=6.0",
  "pathspec>=0.12",
  # Sprint 6h₉a (ADR-0094/0095/0096): contracts Pydantic models for the
  # 4-tier extension architecture (descriptor envelope, manifest, primitives).
  "pydantic>=2.7,<3",
  # ADR-0244, #137: one live writer per session file. MIT, zero runtime
  # dependencies of its own, one pure-python wheel for every platform, and
  # ``py.typed``. It is here rather than hand-rolled because the Windows half
  # is real ``LockFileEx``/``UnlockFileEx`` with a reparse-point refusal, and
  # #46 is this repo's standing precedent for getting that half wrong.
  #
  # The floor is MEASURED, not guessed. ``thread_local=`` — which the lock
  # passes so the owner of a session file is the process and not the thread
  # that happened to open it — first exists in 3.12.0; 3.11.0 raises
  # ``TypeError`` on it. Every property the lock relies on (native and not
  # soft, a second handle contends, re-acquire after release, a killed
  # holder's lock reclaimed with no cleanup code of ours) was run against
  # 3.12.0, 3.12.2, 3.12.4, 3.13.4, 3.16.1, 3.18.0, 3.20.0, 3.25.2, 3.29.0,
  # 3.32.3, 3.32.7 and 4.0.1. See ADR-0244 §"The floor is measured".
  "filelock>=3.12,<5",
]

[project.urls]
Homepage = "https://github.com/handochan/aelix-ai"
Repository = "https://github.com/handochan/aelix-ai"
Issues = "https://github.com/handochan/aelix-ai/issues"

[tool.uv.sources]
aelix-ai = { workspace = true }

# #111 B-7 — developer-state exclusions on both targets. See the root
# pyproject.toml for the rationale. NARROW ON PURPOSE: exact directory names,
# exact file names and one scoped glob only. Never widen to an extension glob —
# the distributions carry content files, not only .py sources.
[tool.hatch.build.targets.wheel]
packages = ["src/aelix_agent_core"]
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
  ".env",
  ".env.local",
]

[tool.hatch.build.targets.sdist]
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
  ".env",
  ".env.local",
]
