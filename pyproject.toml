[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aelix"
version = "0.1.0b1"
description = "Aelix — a pi-faithful Python agent runtime (providers, tools, compaction, extensions, TUI)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Aelix Contributors" }]
keywords = ["ai", "agent", "llm", "tui", "cli", "coding-agent", "anthropic", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Inter-package deps are pinned to the shared release version so the
# published umbrella pulls a compatible, lock-step set from PyPI. The
# `[tool.uv.sources] workspace = true` entries below are dev-only and are
# stripped from the built metadata — the published wheel uses these pins.
dependencies = [
  "aelix-ai==0.1.0b1",
  "aelix-agent-core==0.1.0b1",
  "aelix-coding-agent==0.1.0b1",
]

[project.optional-dependencies]
# `pip install 'aelix[tui]'` (or `uv tool install 'aelix[tui]'`) pulls the
# interactive TUI deps through the coding-agent extra; `[images]` adds inline
# image rendering on top. The bare `aelix` install provides the `aelix` CLI +
# the non-interactive (print/json/rpc) modes.
tui = ["aelix-coding-agent[tui]==0.1.0b1"]
images = ["aelix-coding-agent[tui,images]==0.1.0b1"]

[project.urls]
Homepage = "https://github.com/handochan/aelix-ai"
Repository = "https://github.com/handochan/aelix-ai"
Issues = "https://github.com/handochan/aelix-ai/issues"

# The `aelix` console script is re-declared here so `uv tool install aelix`
# works: uv tool only installs executables provided by the *target* package,
# not its dependencies. The target is the same function that
# aelix-coding-agent's own script points at, so when both wheels land in one
# environment the generated launcher is byte-identical either way. The demo
# entry in src/aelix/__main__.py remains reachable via `python -m aelix`.
[project.scripts]
aelix = "aelix_coding_agent.cli.entry:main_sync"

# #111 B-7 — developer-state exclusions, stated on EVERY target.
#
# WHY THIS IS NOT REDUNDANT WITH .gitignore: hatchling honours VCS ignore rules
# only when they are there to honour. A build run from a checkout whose
# .gitignore has drifted, or from any tree assembled without one, has no such
# protection. These lists are the load-bearing copy; .gitignore is the belt.
#
# BE HONEST ABOUT WHICH ONE IS DOING THE WORK — measured, not assumed. In the
# live worktree the belt gets there first: strip every pattern below and a
# planted `.omc/state/agent-replay-*.jsonl` STILL does not reach the wheel,
# because .gitignore already excluded it. That is why
# tests/packaging/test_build_hygiene.py builds from a COPY OF THE REPO WITH
# .gitignore DELETED — building in place would measure the belt and keep
# reporting a clean artifact long after these lists had been mangled. Measured
# both ways: belt-less + no excludes -> 7 planted paths leak into the wheel;
# belt-less + these excludes -> 0 leak, all four content files intact.
# (The per-package sdists DO ship the repo .gitignore, so "an sdist consumer has
# no .gitignore" is NOT the justification — do not lean on it.)
#
# NARROW ON PURPOSE — DO NOT WIDEN. Every entry is an exact directory name, an
# exact file name, or a tightly-scoped glob. The distributions are CONTENT
# carriers, not just code: `examples/INDEX.md`, `examples/echo/aelix-plugin.toml`,
# `examples/echo/echo.py` and `extensions/api.py` ship inside the
# aelix-coding-agent wheel and are cited by ABSOLUTE PATH by the #117
# self-extension signpost. A pattern like `*.md`, `*.toml` or `*.json` would drop
# them silently and the installed agent would name files that are not on disk.
# tests/packaging/test_build_hygiene.py builds for real and fails if it happens.
#
# #143 — `.claude` joined the list, and it is the entry with the sharpest teeth.
# Claude Code keeps its per-checkout state under `.claude/`, including
# `.claude/worktrees/<name>/` — FULL working copies of this repo, one per agent
# session. `.claude` was in NEITHER exclude list NOR `.gitignore` — only in
# `.git/info/exclude`, which is per-clone and does not travel with a clone, so a
# fresh `actions/checkout` in CI never had it and nobody noticed. It is now in
# all three places: both exclude lists (load-bearing) and `.gitignore` (belt).
#
# THE SIZE OF THIS LEAK IS NOT A CONSTANT — do not read the figures below as one,
# and do not "correct" them when a rebuild disagrees. Three `uv build --sdist`
# runs against the SAME commit (ee1623c), same machine, measured: 20,039,596
# bytes / 3,065 entries / 1,994 under `.claude/worktrees/`; then 4,112 entries
# six minutes later; then 48,004,955 bytes / 8,304 entries / 7,233 under
# `.claude/worktrees/` later the same day. Nothing about the commit changed —
# agent sessions kept checking out more working copies. Every number here is a
# FLOOR observed at a moment, and the floor rises for as long as this repo is
# worked on by agents. The durable fact is the class, not the digits: whatever
# sessions are alive when someone runs `uv build`, all of them ship.
#
# `.uv-cache` joined the list next, and it is the one that shows why the belt
# cannot be the answer. uv writes its own `.gitignore` containing `*` INSIDE the
# cache directory, so `git check-ignore` calls every file in there ignored — and
# that same ee1623c sdist still carried five of them (`.gitignore`, `.lock`,
# `CACHEDIR.TAG`, `interpreter-v4/**/*.msgpack`, `sdists-v9/.gitignore`), because
# hatchling consults the ROOT `.gitignore` and not nested ones. Git agreeing that
# a path is ignored proves nothing about what a build ships. Only the exclude
# list closes it, which is exactly the property the test below measures.
#
# `.claude/settings.json` LOOKS REDUNDANT NEXT TO `.claude` AND IS NOT. DO NOT
# DELETE IT AS A DUPLICATE. `.gitignore` carries a deliberate negation for that
# one path (it is Claude Code's checked-in TEAM config, so git must be allowed to
# track it), and hatchling does not layer the two lists the way the ordering
# suggests: `BuilderConfig.exclude_spec` concatenates the `.gitignore` lines and
# these patterns into ONE `pathspec.GitIgnoreSpec`, where a pattern matching the
# FILE beats a pattern matching only its parent DIRECTORY regardless of which
# came later. So `!/.claude/settings.json` (file) outranks `.claude` (directory)
# even though `.claude` is appended after it. Measured: with the negation in
# `.gitignore` and only `.claude` here, a real `uv build --sdist` shipped
# `.claude/settings.json`; adding this exact path took it back out and changed
# nothing else. Note that the older fixtures in that test DELETE `.gitignore`, so
# they cannot see this interaction at all — `test_the_team_config_negation_does_
# not_reopen_the_claude_hole` is the one that builds with the belt in place.
[tool.hatch.build.targets.wheel]
packages = ["src/aelix"]
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
]

# The sdist is the worse leak of the two: its default file set is the whole repo
# root, so before this section a local `uv build` swept `.omc/specs/**` (51
# internal sprint plans and review memos, including untracked ones), `.omc/wiki/`
# session logs, `CLAUDE.md`, `AGENTS.md` and root `aelix-session-*.html` into a
# 5.7 MB tarball that would have been attached to the GitHub release.
[tool.hatch.build.targets.sdist]
exclude = [
  ".claude",
  ".claude/settings.json",
  ".uv-cache",
  ".omc",
  "__pycache__",
  "*.pyc",
  "*.pyo",
  ".ruff_cache",
  ".pytest_cache",
  "CLAUDE.md",
  "AGENTS.md",
  "aelix-session-*.html",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aelix-ai = { workspace = true }
aelix-agent-core = { workspace = true }
aelix-coding-agent = { workspace = true }
aelix-server = { workspace = true }

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pyright>=1.1.409",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  # Sprint 6h₁₀a: aelix-coding-agent[tui] extra libs, pulled into the dev
  # env so pyright + pytest resolve them (both ship py.typed). End users
  # still install them via the gated `[tui]` extra.
  "prompt-toolkit>=3.0,<4",
  "rich>=13.7,<15",
  # Sprint 6h₁₀c: aelix-coding-agent[images] extra libs, pulled into the dev
  # env so pyright + pytest resolve them. End users install them via the
  # gated `[images]` extra. term-image is NOT pulled in here: its latest
  # release (0.7.2) hard-caps Pillow<11, conflicting with the coding-agent's
  # Pillow>=11 core pin, so it cannot be co-resolved in this workspace. The
  # images.py graphics tier guards the term-image import (placeholder when
  # absent); rich-pixels (Pillow>=10) drives the always-available Unicode tier.
  "rich-pixels>=3.0,<4",
  "pyte>=0.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Repo root on sys.path so cross-module test imports (`from tests.tui...`)
# resolve under the bare `pytest` script (CI) as well as `python -m pytest`.
pythonpath = ["."]

[tool.pyright]
# `packages/*/src` matched NOTHING. With it pyright analysed 8 files -- this
# repo's own `src` (2) plus `scripts` (6) -- and the only errors it could ever
# report came from a spike script, so the 239 files of product source across the
# four packages had never been type-checked at all. `**` expands where `*` did
# not. An include that silently matches nothing reads exactly like a clean tree,
# so assert `filesAnalyzed` before believing any count this gate produces.
include = ["src", "packages/**/src", "scripts"]
# The editable installs' `.pth` files hard-code the MAIN checkout's absolute
# paths. Inside a git worktree that makes every cross-package import resolve to
# a SECOND copy of the same module, and pyright then reports errors that do not
# exist on main (measured at one commit: 55 in a worktree vs 44 on main; adding
# these paths brought the worktree to 44). Relative paths resolve against this
# file, so every checkout -- worktree, fresh clone, CI -- type-checks its own
# tree and they agree.
extraPaths = [
  "packages/aelix-agent-core/src",
  "packages/aelix-ai/src",
  "packages/aelix-coding-agent/src",
  "packages/aelix-server/src",
]
# `scripts/pyright_spike.py` is `# pyright: strict` and ENDS in three deliberate
# negative assertions ("Inverse cases -- pyright MUST emit errors for narrowing
# to be considered working"). Its 8 errors are its PASSING state, so a gate that
# includes it can never go green, and a round that "fixed" them would delete the
# check that `ExtensionAPI.on`'s overloads still narrow. It is excluded here and
# run INVERTED in CI, where zero errors is the failure (ADR-0213). The three
# entries above it are pyright's own defaults, which naming `exclude` replaces.
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "scripts/pyright_spike.py",
]
pythonVersion = "3.11"
